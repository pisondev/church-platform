name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the hooks
        run: node --test "scripts/*.test.mjs"
      - name: Reject AI attribution in history
        run: sh scripts/check-commits.sh
      - name: Reject AI tool files
        run: git ls-files | sh scripts/check-ai-files.sh

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: church_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church -d church_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://church:church@localhost:5432/church_platform_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  frontends:
    name: Frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Type-check
        run: pnpm -r --if-present typecheck
      - name: Test
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm -r --if-present build
